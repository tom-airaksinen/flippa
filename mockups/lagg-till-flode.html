<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flippa – Lägg till ord, flödesvarianter</title>
<style>
  :root{ --bg:#0d1426; --surface:#16203a; --surface-2:#1f2c4d; --text:#f2f4f8; --muted:#9aa3b2;
    --accent:#5b8cff; --line:#2c3c63; --good:#5bbf72; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#070b15;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:24px 14px 70px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 auto 16px;max-width:660px;font-size:.9rem}
  code{font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .tabs button{background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:10px;font:inherit;font-size:.88rem;cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

  .prefbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;margin-bottom:16px;font-size:.84rem;color:var(--muted);max-width:560px}
  .prefbar select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 9px;font:inherit;font-size:.84rem}

  .phone{width:100%;max-width:390px;background:var(--bg);border:1px solid var(--line);
    border-radius:22px;padding:16px 14px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .phone h3{margin:2px 0 10px;font-size:1.08rem}
  .modal-hint{color:var(--muted);font-size:.82rem;margin:0 0 12px;line-height:1.45}
  label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}
  input[type=text],textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;color:var(--text);padding:11px 14px;font:inherit;font-size:.95rem}
  textarea{resize:vertical;min-height:76px}

  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    padding:9px 6px;border-radius:10px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
  .seg button.seg-on{background:var(--accent);border-color:var(--accent);color:#fff}

  .ai-stepper{display:flex;align-items:center;width:calc(50% - 5px);background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:2px}
  .ai-stepper button{width:42px;height:42px;flex:none;border:none;background:none;
    color:var(--accent);font-size:1.4rem;cursor:pointer}
  .ai-stepper>span{flex:1;text-align:center;font-weight:700}

  .ai-send{display:flex;gap:10px;margin-top:16px}
  .ai-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:13px 10px;border-radius:12px;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer}
  .ai-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .ai-logo{width:17px;height:17px;flex:none}

  .add-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.76rem;
    text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
  .add-divider::before,.add-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .tertiary-c{text-align:center;margin-top:10px}
  .link-action{background:none;border:none;color:var(--accent);font:inherit;font-size:.84rem;
    cursor:pointer;text-decoration:underline;padding:0}

  .aiwrap{position:relative}
  .aipop{position:absolute;z-index:9;top:calc(100% + 7px);left:0;right:0;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 16px 38px rgba(0,0,0,.5)}
  .aipop.hidden{display:none}
  .aipop button.row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    color:var(--text);text-align:left;padding:11px 12px;border-radius:8px;font:inherit;font-size:.95rem;cursor:pointer}
  .aipop button.row:hover{background:var(--surface-2)}
  .remember{display:flex;align-items:center;gap:9px;padding:9px 12px 5px;font-size:.86rem;color:var(--muted);cursor:pointer}
  .remember input{width:16px;height:16px;accent-color:var(--accent)}
  .aipop .note{background:none;border:none;padding:4px 12px 7px;margin:0;font-size:.76rem;color:var(--muted)}
  .rememberbar{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:.84rem;color:var(--muted);cursor:pointer}
  .rememberbar input{width:16px;height:16px;accent-color:var(--accent)}
  .aftertip{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.8rem;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .aftertip .link-action{font-size:.8rem}

  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{flex:1;padding:13px;border-radius:12px;font:inherit;font-size:.95rem;
    font-weight:700;cursor:pointer;border:1px solid var(--line)}
  .btn-secondary{background:var(--surface-2);color:var(--text)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .pick-list{display:flex;flex-direction:column;gap:8px;margin:4px 0}
  .pick-item{display:flex;align-items:center;gap:11px;width:100%;background:var(--surface-2);
    border:1px solid transparent;color:var(--text);font:inherit;font-size:.95rem;font-weight:600;
    text-align:left;padding:14px 13px;border-radius:12px;cursor:pointer}
  .pick-item .pi-ic{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
  .pick-item .pi-d{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:2px}
  .pick-item.on{border-color:var(--accent);background:var(--surface)}
  .pick-item .pi-chev{margin-left:auto;color:var(--muted)}

  .note{max-width:660px;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;font-size:.86rem;color:var(--muted)}
  .note b{color:var(--text)}
  .note ul{margin:7px 0 0;padding-left:18px}
  .note li{margin:4px 0}
  .tag{display:inline-block;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;
    padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .steps{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
</style>
</head>
<body>
<h1>Lägg till ord – flödesvarianter</h1>
<p class="sub">Fyra sätt att bygga dialogen när AI-valet redan finns i profilen.
Byt AI-inställning här nedan så ser du hur varje variant beter sig.</p>

<div class="prefbar">
  <span>AI-inställning i profilen:</span>
  <select id="pref">
    <option value="">Inte satt – frågar varje gång</option>
    <option value="claude" selected>Claude</option>
    <option value="gpt">ChatGPT</option>
    <option value="copy">Kopiera frågan</option>
  </select>
  <span id="prefnote"></span>
</div>

<div class="tabs" id="tabs">
  <button data-v="a" class="on">A · Dagens</button>
  <button data-v="a2">A2 · Liten meny</button>
  <button data-v="a3">A3 · Kryss under</button>
  <button data-v="a4">A4 · Minns automatiskt</button>
  <button data-v="b">B · Ett fält</button>
  <button data-v="c">C · Källa först</button>
  <button data-v="d">D · AI först när tomt</button>
</div>

<div class="phone" id="phone"></div>
<div class="note" id="note"></div>

<script>
var CLAUDE = '<svg class="ai-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M12.00 11.40L13.10 2.15A1.10 1.10 0 0 1 10.90 2.15ZM12.32 11.50L18.25 4.31A1.10 1.10 0 0 1 16.40 3.12ZM12.55 11.75L21.42 8.91A1.10 1.10 0 0 1 20.50 6.91ZM12.59 12.09L21.59 14.49A1.10 1.10 0 0 1 21.91 12.31ZM12.45 12.39L18.72 19.28A1.10 1.10 0 0 1 20.16 17.62ZM12.17 12.58L13.72 21.76A1.10 1.10 0 0 1 15.83 21.14ZM11.83 12.58L8.17 21.14A1.10 1.10 0 0 1 10.28 21.76ZM11.55 12.39L3.84 17.62A1.10 1.10 0 0 1 5.28 19.28ZM11.41 12.09L2.09 12.31A1.10 1.10 0 0 1 2.41 14.49ZM11.45 11.75L3.50 6.91A1.10 1.10 0 0 1 2.58 8.91ZM11.68 11.50L7.60 3.12A1.10 1.10 0 0 1 5.75 4.31Z"/></svg>';
var GPT = '<svg class="ai-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.08524.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>';
var COPY = '<span style="font-size:1.05rem">⧉</span>';
var STARS = '<svg class="ai-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M10 5 11.7 10.3 17 12 11.7 13.7 10 19 8.3 13.7 3 12 8.3 10.3Z"/><path d="M18 4 18.8 6.2 21 7 18.8 7.8 18 10 17.2 7.8 15 7 17.2 6.2Z"/></svg>';

var AI = { claude:{n:"Claude",ic:CLAUDE}, gpt:{n:"ChatGPT",ic:GPT}, copy:{n:"kopiera",ic:COPY} };
var variant = "a", pref = "claude";

function valdKnapp(){
  if(pref==="copy") return '<button class="ai-btn primary">'+COPY+'Kopiera prompten</button>';
  return '<button class="ai-btn primary">'+AI[pref].ic+'Fråga '+AI[pref].n+'</button>';
}
function menyrader(){
  return '<button class="row">'+CLAUDE+'Öppna i Claude</button>'
       + '<button class="row">'+GPT+'Öppna i ChatGPT</button>'
       + '<button class="row">'+COPY+'Kopiera frågan</button>';
}
// Alla varianter ser LIKADANA ut när ett val redan är sparat – skillnaden ligger
// bara i läget innan, när inställningen är "fråga varje gång".
function aiKnapp(v){
  if(pref) return '<div class="ai-send">'+valdKnapp()+'</div>'
    + '<div class="tertiary-c"><button class="link-action">Använd en annan AI</button></div>';

  if(v==="a2") return '<div class="aiwrap">'
    + '<div class="ai-send"><button class="ai-btn primary" onclick="document.getElementById(\'pop\').classList.toggle(\'hidden\')">'
    + STARS+'Fråga en AI</button></div>'
    + '<div class="aipop hidden" id="pop">'+menyrader()
    + '<label class="remember"><input type="checkbox"><span>Kom ihåg mitt val</span></label>'
    + '<p class="note">Nästa gång går knappen direkt dit.</p></div></div>';

  if(v==="a3") return '<div class="ai-send">'
    + '<button class="ai-btn">'+CLAUDE+'Claude</button>'
    + '<button class="ai-btn">'+GPT+'ChatGPT</button></div>'
    + '<label class="rememberbar"><input type="checkbox"><span>Kom ihåg mitt val</span></label>'
    + '<div class="tertiary-c"><button class="link-action">⧉ Kopiera prompt (för annan AI)</button></div>';

  if(v==="a4") return '<div class="ai-send">'
    + '<button class="ai-btn">'+CLAUDE+'Claude</button>'
    + '<button class="ai-btn">'+GPT+'ChatGPT</button></div>'
    + '<div class="aftertip">Kommer ihåg ChatGPT nästa gång.'
    + '<button class="link-action">Ångra</button></div>'
    + '<div class="tertiary-c"><button class="link-action">⧉ Kopiera prompt (för annan AI)</button></div>';

  return '<div class="ai-send">'
    + '<button class="ai-btn">'+CLAUDE+'Claude</button>'
    + '<button class="ai-btn">'+GPT+'ChatGPT</button></div>'
    + '<div class="tertiary-c"><button class="link-action">⧉ Kopiera prompt (för annan AI)</button></div>';
}
function stepper(){ return '<label>Antal ord/fraser</label><div class="ai-stepper">'
  + '<button>−</button><span>20</span><button>+</button></div>'; }

var V = {
a: function(v){ return ''
  + '<h3>Lägg till ord</h3>'
  + '<div class="seg"><button>Manuellt</button><button>Slå upp</button><button class="seg-on">AI</button></div>'
  + '<p class="modal-hint">Låt en AI föreslå ord. Öppnas med prompten ifylld – klistra sedan in svaret.</p>'
  + stepper()
  + '<label>Tema</label><input type="text" value="Mat och dryck">'
  + aiKnapp(v)
  + '<div class="add-divider">När du fått svaret</div>'
  + '<textarea placeholder="Klistra in AI:ns svar här"></textarea>'
  + '<div class="modal-actions"><button class="btn-secondary">Stäng</button>'
  + '<button class="btn-primary">Lägg till från svaret</button></div>'; },
a2: function(){ return V.a("a2"); },
a3: function(){ return V.a("a3"); },
a4: function(){ return V.a("a4"); },

b: function(){ return ''
  + '<h3>Lägg till ord</h3>'
  + '<p class="modal-hint">Skriv eller klistra in – ett ord per rad, <b>utländskt;svenskt</b>. '
  + 'Appen känner igen både egna rader och ett AI-svar.</p>'
  + '<textarea rows="5" placeholder="ciao;hej&#10;grazie;tack;1"></textarea>'
  + '<div class="add-divider">Kom inte på något?</div>'
  + aiKnapp(variant)
  + '<div class="tertiary-c" style="margin-top:14px"><button class="link-action">🔍 Slå upp enstaka ord i stället</button></div>'
  + '<div class="modal-actions"><button class="btn-secondary">Avbryt</button>'
  + '<button class="btn-primary">Lägg till</button></div>'; },

c: function(){ return ''
  + '<h3>Lägg till ord</h3>'
  + '<div class="steps"><span class="dot on"></span><span class="dot"></span></div>'
  + '<p class="modal-hint">Varifrån kommer orden?</p>'
  + '<div class="pick-list">'
  + '<button class="pick-item"><span class="pi-ic">✍️</span><span>Jag skriver själv'
  + '<span class="pi-d">Eller klistrar in en lista jag redan har</span></span><span class="pi-chev">›</span></button>'
  + '<button class="pick-item"><span class="pi-ic">🔍</span><span>Slå upp ord'
  + '<span class="pi-d">Skriv svenska ord, få översättningen</span></span><span class="pi-chev">›</span></button>'
  + '<button class="pick-item on"><span class="pi-ic">'+(pref&&pref!=="copy"?AI[pref].ic:STARS)+'</span><span>'
  + (pref&&pref!=="copy" ? "Fråga "+AI[pref].n : "Ta hjälp av AI")
  + '<span class="pi-d">Föreslår ord på ett tema</span></span><span class="pi-chev">›</span></button>'
  + '</div>'
  + '<div class="modal-actions"><button class="btn-secondary">Avbryt</button></div>'; },

d: function(){ return ''
  + '<h3>Lektionen är tom</h3>'
  + '<p class="modal-hint">Fyll den snabbast med AI – eller lägg in ord själv.</p>'
  + stepper()
  + '<label>Tema</label><input type="text" value="Mat och dryck">'
  + aiKnapp(variant)
  + '<div class="add-divider">eller</div>'
  + '<div class="pick-list">'
  + '<button class="pick-item"><span class="pi-ic">✍️</span><span>Skriv in ord själv</span><span class="pi-chev">›</span></button>'
  + '<button class="pick-item"><span class="pi-ic">🔍</span><span>Slå upp ord</span><span class="pi-chev">›</span></button>'
  + '</div>'
  + '<div class="modal-actions"><button class="btn-secondary">Stäng</button></div>'; }
};

var NOTES = {
a2: '<b>A2 · Liten meny</b><span class="tag">samma som Ta hjälp av AI</span>'
 + '<ul><li>En knapp som fäller ut de tre valen – exakt samma mönster som minnesregelns '
 + '”Ta hjälp av AI”. Lär man sig det ena kan man det andra.</li>'
 + '<li>”Kom ihåg mitt val” sitter i menyn, där man ändå står när man väljer.</li>'
 + '<li>Kompakt: dialogen är redan hög, och två knappar blir en.</li>'
 + '<li>Kostar ett tryck extra tills man kryssat i.</li></ul>',
a3: '<b>A3 · Kryss under knapparna</b>'
 + '<ul><li>Inget extra tryck – båda valen syns direkt, precis som idag.</li>'
 + '<li>Kryssrutan är synlig hela tiden, inte gömd bakom en meny. Svårare att missa.</li>'
 + '<li>Men: tar en rad till i en dialog som redan är lång, och kryssrutan syns även '
 + 'för den som aldrig tänkt spara något.</li></ul>',
a4: '<b>A4 · Minns automatiskt, med ångra</b>'
 + '<ul><li>Noll friktion: du trycker bara på din AI, och appen minns. Raden under '
 + 'berättar vad som hände och låter dig ångra.</li>'
 + '<li>Sparar flest klick av alla varianter – ingen kryssruta att hitta.</li>'
 + '<li>Men: appen bestämmer åt användaren. Det kan kännas påstridigt, och ”Ångra” '
 + 'måste synas länge nog för att hinna läsas.</li>'
 + '<li>Skulle också behöva göras likadant i Ta hjälp av AI, annars beter sig de två '
 + 'ställena olika.</li></ul>',
a: '<b>A · Dagens flöde, ett AI-mål</b><span class="tag">minst risk</span>'
 + '<ul><li>Allt sitter kvar – bara de två AI-knapparna blir en, styrd av profilvalet.</li>'
 + '<li>Ändrar ingenting för den som redan lärt sig dialogen.</li>'
 + '<li>Men: segmentkontrollen betyder fortfarande att man måste välja läge innan man ser något. '
 + 'Tre flikar där två sällan används.</li></ul>',
b: '<b>B · Ett fält</b>'
 + '<ul><li>Inga flikar. Textrutan är det första och största – det man oftast vill göra.</li>'
 + '<li>AI ligger under som hjälp när man kört fast, inte som ett eget läge.</li>'
 + '<li>”Slå upp” blir en länk i stället för en flik – kortare väg för de många, en klick till för de få.</li>'
 + '<li>Risk: samma ruta gör två saker (egna rader och AI-svar). Formatet är samma, men det måste synas i texten.</li></ul>',
c: '<b>C · Källa först</b>'
 + '<ul><li>Ett beslut i taget: först varifrån orden kommer, sedan ett fokuserat steg utan brus.</li>'
 + '<li>Varje val kan få en förklarande rad – bra för Maria och andra som inte vet vad ”Slå upp” betyder.</li>'
 + '<li>Profilvalet syns direkt i alternativet (”Fråga Claude”).</li>'
 + '<li>Kostar en extra knapptryckning varje gång, även när man alltid gör samma sak.</li></ul>',
d: '<b>D · AI först när lektionen är tom</b>'
 + '<ul><li>Anpassar sig efter läget: en tom lektion ska fyllas, och då är AI snabbast.</li>'
 + '<li>Har lektionen redan ord visas dagens dialog i stället.</li>'
 + '<li>Löser ett verkligt tillfälle (”ny lektion, nu då?”) utan att röra det vanliga flödet.</li>'
 + '<li>Men: två olika dialoger för samma knapp kan förvirra om man inte fattar varför.</li></ul>'
};

function rita(){
  document.getElementById("phone").innerHTML = V[variant](variant);
  document.getElementById("note").innerHTML = NOTES[variant];
  document.getElementById("prefnote").textContent =
    pref ? "→ ett tryck" : "→ menyn visas";
}
document.getElementById("tabs").onclick = function(e){
  var b = e.target.closest("button"); if(!b) return;
  variant = b.dataset.v;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x===b); });
  rita();
};
