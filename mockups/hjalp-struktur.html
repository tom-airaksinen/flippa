omskriven; det som ändras är hur man kommer åt den.</p>

var variant = "now", oppna = {}, oppnaGrp = {}, filter = "";
var $ = function(id){ return document.getElementById(id); };
var TEMAN = ["Komma igång", "Öva", "Vad du övar", "Ord & verktyg"];

function textAv(a){ return (a.t + " " + a.q + " " + a.h).replace(/<[^>]+>/g, " ").toLowerCase(); }
function trafflista(){
  var f = filter.trim().toLowerCase();
  return !f ? AVSNITT : AVSNITT.filter(function(a){ return textAv(a).indexOf(f) >= 0; });
}

function accRad(a, i, rubrik){
  var open = !!oppna[i];
  return '<div class="acc' + (open ? " open" : "") + '" data-i="' + i + '">' +
    '<button class="acc-h">' + rubrik + '<span class="chev">▸</span></button>' +
    '<div class="acc-b">' + a.h + '</div></div>';
}

function render(){
  var b = $("body"), html = "";

  if (variant === "now") {
    html = AVSNITT.map(function(a){ return '<h3>' + a.t + '</h3>' + a.h; }).join("");
  }
  if (variant === "acc") {
    html = AVSNITT.map(function(a, i){ return accRad(a, i, a.t); }).join("");
  }
  if (variant === "grp") {
    html = TEMAN.map(function(tema){
      var ids = [];
      AVSNITT.forEach(function(a, i){ if (a.g === tema) ids.push(i); });
      var open = !!oppnaGrp[tema];
      return '<div class="grp' + (open ? " open" : "") + '" data-g="' + tema + '">' +
        '<button class="grp-h">' + tema + '<span class="cnt">' + ids.length + '</span></button>' +
        '<div class="grp-b">' + ids.map(function(i){
          return accRad(AVSNITT[i], i, AVSNITT[i].q); }).join("") + '</div></div>';
    }).join("");
  }
  if (variant === "flat") {
    html = TEMAN_D.map(function(tema){
      var med = AVSNITT.filter(function(a){ return temaD(a) === tema; });
      var open = !!oppnaGrp[tema];
      var antal = med.length + (tema === "Grundtankar" ? 1 : 0);
      var kropp = (tema === "Grundtankar" ? '<div class="grund">' + GRUND.h + '</div>' : "") +
        med.map(function(a, k){
          return '<h4>' + a.q + '</h4><div class="' + (k === med.length - 1 ? "sist" : "") + '">' +
                 a.h + '</div>';
        }).join("");
      return '<div class="grp' + (open ? " open" : "") + '" data-g="' + tema + '">' +
        '<button class="grp-h">' + tema + '<span class="cnt">' + antal + '</span></button>' +
        '<div class="grp-b">' + kropp + '</div></div>';
    }).join("");
  }
  if (variant === "kort") {
    html = '<p class="intro">' + INTRO + '</p>' + TEMAN_D.map(function(tema){
      var med = AVSNITT.filter(function(a){ return temaD(a) === tema && KORT[a.q]; });
      var open = !!oppnaGrp[tema];
      var antal = med.length + (tema === "Grundtankar" ? 1 : 0);
      var kropp = (tema === "Grundtankar" ? '<div class="kort">' + KORT_GRUND + '</div>' : "") +
        '<div class="kort">' + med.map(function(a){
          return '<h4>' + a.q + '</h4>' + KORT[a.q]; }).join("") + '</div>';
      return '<div class="grp' + (open ? " open" : "") + '" data-g="' + tema + '">' +
        '<button class="grp-h">' + tema + '<span class="cnt">' + antal + '</span></button>' +
        '<div class="grp-b">' + kropp + '</div></div>';
    }).join("");
  }
  if (variant === "faq") {
    var lista = trafflista();
    html = '<div class="searchrow"><input type="search" id="q" placeholder="Sök i hjälpen…" value="' +
      filter.replace(/"/g, "&quot;") + '"></div>' +
      (filter.trim()
        ? '<div class="hitcount">' + lista.length + ' av ' + AVSNITT.length + ' avsnitt</div>' : "") +
      (lista.length
        ? lista.map(function(a){ return accRad(a, AVSNITT.indexOf(a), a.q); }).join("")
        : '<div class="nohit">Inget matchade &rdquo;' + filter + '&rdquo;.</div>');
  }
  b.innerHTML = html;

  b.querySelectorAll(".acc-h").forEach(function(el){
    el.onclick = function(){
      var i = +el.closest(".acc").dataset.i;
      oppna[i] = !oppna[i];
      render();
    };
  });
  b.querySelectorAll(".grp-h").forEach(function(el){
    el.onclick = function(){
      var g = el.closest(".grp").dataset.g;
      oppnaGrp[g] = !oppnaGrp[g];
      render();
    };
  });
  var q = $("q");
  if (q) {
    q.oninput = function(){ filter = this.value; render(); $("q").focus(); };
  }

  // Hur långt måste man scrolla för att se allt som finns?
  requestAnimationFrame(function(){
    var vy = b.clientHeight, hela = b.scrollHeight;
    var synligaRubriker = 0;
    b.querySelectorAll(".acc-h, .grp-h, h3").forEach(function(el){
      if (el.getBoundingClientRect().top - b.getBoundingClientRect().top < vy) synligaRubriker++;
    });
    $("stat").innerHTML = 'I viloläge: <b>' + Math.round(hela) + ' px</b> att scrolla (' +
      (hela / vy).toFixed(1) + ' skärmar) · <b>' + synligaRubriker +
      '</b> rubriker syns utan att scrolla';
  });

  $("note").innerHTML = NOTER[variant];
}

    '<ul><li>Man ser bara det som råkar ligga i vyn. Att veta <em>vad hjälpen innehåller</em> ' +
    'kräver att man scrollar igenom alltihop.</li>' +
    '<li>Läser man om ett ämne får man resten på vägen, vare sig man vill eller inte.</li>' +
    '<li>Avsnitten är dessutom väldigt olika långa – &rdquo;Lägg till ord&rdquo; är 1 754 tecken, ' +

    '<ul><li><b>Hela innehållsförteckningen på en skärm</b> – man ser vad som finns utan att läsa.</li>' +

    '<ul><li><b>Ett tryck till svaret.</b> B kräver två: först temat, sedan frågan. Här läser ' +

    '<li>Fem rader i viloläge, alltså samma överblick som B.</li>' +

    '<li><b>Att väga:</b> en utfälld sektion är mycket text på en gång – närmare dagens vägg, ' +

  kort: '<b>E · Som D men kortfattat</b> <span class="tag">rekommenderad</span> – samma fem ' +

    '<ul><li>Inledningen är dagens &rdquo;Vad är Flippa?&rdquo; <b>ordagrant</b> – den flyttar ' +

    '<li>CSV-detaljerna (avgränsare, citattecken, UTF-8, mallfil) är nedkokade till vilka ' +

  faq: '<b>C · FAQ med sök</b> <span class="tag">rekommenderad</span> – rubrikerna omformulerade ' +

$("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  variant = b.dataset.v;
  [].forEach.call(this.children, function(x){ x.classList.toggle("on", x === b); });
  oppna = {}; oppnaGrp = {}; filter = "";
  render();
});
render();
</script>
