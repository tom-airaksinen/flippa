name: Persiskt uttal

# Lägger någon till persiska glosor – Malin i sina egna lektioner, jag i mina – får de
# ljud av sig själva inom en kvart. Ljudfilerna är medvetet frikopplade från releaser:
# jobbet rör ALDRIG app.js eller sw.js, bara audio/fa/. Appen hämtar manifestet från
# nätet vid varje start och service workern har en egen, versionsoberoende ljudcache,
# så nya filer når alla utan att någon behöver uppdatera appen.
#
# Nästan alla körningar är no-ops: "saknas" är ett par HTTP-anrop med bara
# standardbiblioteket, och pip/ffmpeg-steget körs först när siffran är över noll.

# TRIGGERN: GitHubs egen schedule-cron är opålitlig för det här repot – uppmätta gap
# på 56 min till 2,7 h (se docs/framtida-utveckling.md "GitHub struntar i cron-schemat"),
# och de första 84 minuterna efter att jobbet lades upp fyrade den inte alls. Push-
# påminnelserna löste det redan med en extern schemaläggare (cron-job.org) som
# dispatchar var 15:e minut på minuten. Vi hänger på samma trigger i stället för att
# sätta upp en till: push-reminders.yml anropar den här som workflow_call.
# schedule ligger kvar som ren backup – skadar inte, men räkna inte med den.
on:
  workflow_call: {}            # push-reminders.yml – den pålitliga kvartstriggern
  workflow_dispatch: {}        # kör manuellt för test
  schedule:
    - cron: "*/15 * * * *"     # backup; GitHub hoppar över den ofta

concurrency:
  group: persiskt-uttal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ljud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: kolla
        name: Hur många ord saknar ljud?
        run: |
          n=$(python3 scripts/tts-fa.py saknas)
          echo "saknas=$n" >> "$GITHUB_OUTPUT"
          echo "$n ord saknar ljud" >> "$GITHUB_STEP_SUMMARY"

      - name: Beroenden
        if: steps.kolla.outputs.saknas != '0'
        run: |
          python3 -m pip install --quiet edge-tts numpy
          which ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Generera
        if: steps.kolla.outputs.saknas != '0'
        run: python3 scripts/tts-fa.py bygg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Committa det som blev
        if: steps.kolla.outputs.saknas != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/fa
          git diff --cached --quiet && { echo "inget nytt att committa"; exit 0; }
          antal=$(git diff --cached --name-only | grep -c '\.mp3$' || true)
          git commit -m "Uttal för $antal nya persiska ord (automatiskt)"
          # Rebase före push: jobbet kör var 15:e minut och kan krocka med en egen push.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Nödbroms: kraschar något ovanför skulle jobbet annars försöka igen var 15:e
      # minut, och GitHub mejla vid varje miss – 96 om dygnet. Vi lägger en paus-fil
      # som får "saknas" att svara 0, så det blir ett mejl och sedan tyst. Radera
      # audio/fa/paus.json (eller kör tts-fa.py bygg lokalt) för att starta om.
      - name: Pausa automatiken efter haveri
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"orsak":"bygget misslyckades","kor":"%s/%s/actions/runs/%s"}\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > audio/fa/paus.json
          git add audio/fa/paus.json
          git commit -m "Pausar uttalsautomatiken efter haveri (kör $GITHUB_RUN_ID)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Automatiken pausad – radera audio/fa/paus.json för att starta om." >> "$GITHUB_STEP_SUMMARY"
