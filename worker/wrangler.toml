name = "flippa-ai"
main = "src/index.js"
compatibility_date = "2026-10-10"

# Varje deploy blir en version, och med preview_urls på får VARJE version en egen
# permanent publik adress – med samma secrets. En gammal version med ett hål står
# alltså kvar och svarar, och kan spendera Gemini-kvoten, långt efter att hålet är
# lagat. Vinsten (testa en version innan den tar trafik) tar vi med curl i stället.
# workers_dev = true är kvar: det är den riktiga adressen appen anropar.
preview_urls = false

[vars]
# Leverantör och modell PER ENDPOINT. Uppslag av ett känt ord är en lätt uppgift där
# gratismodellen duger; lektionsgenerering kräver domänkunskap. Underlag:
# scripts/modelltest (9 modeller blindbedömda, gpt-oss-120b sist, Sonnet 5.5 etta i
# sju av åtta körningar).
LEVERANTOR_SLAUPP = "groq"
MODELL_SLAUPP = "openai/gpt-oss-120b"
LEVERANTOR_LEKTION = "openrouter"
MODELL_LEKTION = "anthropic/claude-sonnet-5.5"
# Billigare andrahandsval om volymen växer: "google/gemini-3.8-flash" (2:a i testet,
# en tredjedel av priset, dubbelt så snabb).

# Profiler som får använda den INBYGGDA lektionsgenereringen (den som kostar pengar).
# Gästkontot delas av alla som provar appen och får bara den externa vägen.
# Tom sträng = alla tillåts.
LEKTION_PROFILER = "tom,hedvig,wille,karin,harry,maria,lucas,malin"

# Gemini-vägen finns kvar men används inte: Google nekar kontot ("project has been
# denied access") även för ett nyskapat projekt. Sätt LEVERANTOR_* till "gemini" den
# dag spärren släpper.
MODELL = "gemini-3.8-flash"
FIREBASE_PROJEKT = "flashcards-484e9"
TILLATNA_ORIGIN = "https://flippa.tomairaksinen.se,https://tom-airaksinen.github.io"

# Nycklarna läggs ALDRIG här. De sätts som secrets:
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
