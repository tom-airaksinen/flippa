name = "flippa-ai"
main = "src/index.js"
compatibility_date = "2026-10-10"

# Varje deploy blir en version, och med preview_urls på får VARJE version en egen
# permanent publik adress – med samma secrets. En gammal version med ett hål står
# alltså kvar och svarar, och kan spendera Gemini-kvoten, långt efter att hålet är
# lagat. Vinsten (testa en version innan den tar trafik) tar vi med curl i stället.
# workers_dev = true är kvar: det är den riktiga adressen appen anropar.
preview_urls = false

[vars]
# Verifierat namn ur /v1beta/models för den här nyckeln – inte ett alias på chans.
# 2.5-flash fanns i listan men ges inte ut till nya användare; Google pekade själv
# på 3.8-flash i felsvaret. Modellen byts här om Google döper om den. Workern skickar
# tillbaka Googles eget felmeddelande, så ett felaktigt namn syns direkt i svaret.
MODELL = "gemini-3.8-flash"
# Bara anrop från appen släpps in. Lägg till http://localhost:8080 om du kör lokalt.
TILLATNA_ORIGIN = "https://flippa.tomairaksinen.se,https://tom-airaksinen.github.io"
# Firebase-projektet vars inloggningar vi litar på (samma som appens databas).
FIREBASE_PROJEKT = "flashcards-484e9"

# Nyckeln läggs ALDRIG här. Den sätts som secret:
#   npx wrangler secret put GEMINI_API_KEY
